name: YC Radar

on:
  schedule:
    # 03:30 UTC = 09:00 IST. Off the hour on purpose: GitHub's scheduler is
    # heavily congested at :00 and delays runs by up to 30 minutes.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run scan
        run: python -m yc_radar --db yc_radar.db --out digests

      - name: Post digest to Slack
        if: env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          text = open("digests/latest.md").read()
          if text.strip().endswith("Nothing changed today."):
              raise SystemExit(0)          # don't ping people with an empty report
          body = json.dumps({"text": text[:38000]}).encode()
          req = urllib.request.Request(os.environ["SLACK_WEBHOOK"], body,
                                       {"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=30)
          PY

      - name: Commit state
        run: |
          git config user.name "yc-radar"
          git config user.email "actions@github.com"
          git add yc_radar.db digests/
          # The DB *is* the state -- without committing it back, every run
          # looks like day one and every company shows up as "new".
          git diff --staged --quiet || git commit -m "scan $(date -u +%Y-%m-%d)"
          git push
